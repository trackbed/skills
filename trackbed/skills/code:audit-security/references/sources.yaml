  - id: owasp-csrf-testing
    url: https://raw.githubusercontent.com/OWASP/wstg/master/document/4-Web_Application_Security_Testing/06-Session_Management/05-Cross_Site_Request_Forgery.md
    title: "OWASP Web Security Testing Guide - Testing for Cross Site Request Forgery"
    rationale: "The browser-ambient credential model, including cookies and HTTP authentication, informs the trust-boundary requirement to assess CSRF beyond cookie-authenticated state changes and the rule that SameSite never counts as an observed control for an HTTP-authenticated candidate. Its SameSite considerations, including checking the cookie's actual Set-Cookie header, inform the unset and Lax rules and recording a cookie issued outside the repository as unknown, and its point that CSRF reaches intranet servers behind a firewall informs the internal-only placement rule."
    usage: inspiration
    last_reviewed_at: 2026-11-06
    baseline_commit: "b2d226e9b53b56814919fbef90392aa48198711c"
    baseline_hash: "sha256:1ac48d5cee3da8fbc9dd014c40e2788ac619090024daea09364ab877e45a1d79"
