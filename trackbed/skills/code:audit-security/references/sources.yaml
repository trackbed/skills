    title: "no-session/pstack - CSO security audit"
    rationale: "The infrastructure-first attack-surface census, whole-repository category breadth, evidence filtering, and remediation-oriented report influenced this audit; the local secret-safety, coverage, verification, routing, and output contracts are original."
