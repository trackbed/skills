  - id: owasp-threat-modeling
    url: https://cheatsheetseries.owasp.org/cheatsheets/Threat_Modeling_Cheat_Sheet.html
    title: "OWASP Threat Modeling Cheat Sheet"
    rationale: "The model-first workflow, trust-boundary and data-flow inventory, threat identification, ranking, and review stages inform the audit sequence. Its limits on risk transfer inform the rule that a provider, vendor, or contract counts as a control only when repository configuration shows it enabled, and its review-and-validation stage informs each finding's closure check."
    usage: inspiration
    last_reviewed_at: 2026-11-06
    fetch_mode: curl-html
    baseline_hash: "sha256:a0192a7226a019ad77933065c348ae9f6d1ba2a4808e80ce07acaa9c353c3565"
  - id: owasp-attack-surface-analysis
    url: https://cheatsheetseries.owasp.org/cheatsheets/Attack_Surface_Analysis_Cheat_Sheet.html
    title: "OWASP Attack Surface Analysis Cheat Sheet"
    rationale: "The requirement to enumerate entry points, data, privileged operations, and changing attack surfaces informs the repository-wide inventory."
    usage: inspiration
    last_reviewed_at: 2026-11-06
    fetch_mode: curl-html
