  - id: microsoft-stride
    url: https://raw.githubusercontent.com/MicrosoftDocs/azure-docs/refs/heads/main/articles/security/develop/threat-modeling-tool-threats.md
    title: "Microsoft Threat Modeling Tool - STRIDE threats"
    rationale: "The six STRIDE threat categories provide consistent prompts for evaluating every observed trust boundary."
    usage: inspiration
    last_reviewed_at: 2026-08-21
    baseline_commit: "af93316162b0bf50544a925a7346bdd66ff9c79b"
