    rationale: "Now that design-an-interface is deleted upstream, this is the Design It Twice mode's surviving source: the framing and sub-agent output shape in references/design-it-twice.md are cross-checked against it, and the rules that each design sub-agent starts from a fresh context rather than a fork and that dispatch is described by host capability rather than one host's tool follow its 7739eae, 14bfbbd, and c0d6901 changes."
