    title: "Addy Osmani agent-skills - API and interface design"
    rationale: "The skill's overall structure is modeled on this source: the Hyrum's Law framing, contract-first design, validation at trust boundaries only, one error shape with a fixed HTTP status mapping, the naming-convention table, paginated list responses, the REST resource, filtering, and PATCH-versus-PUT patterns, and the TypeScript discriminated-union, input/output separation, and branded-ID patterns."
