    rationale: "The dependency-category framing for choosing test stand-ins and adapter strategy (in-process, local-substitutable, remote-but-owned, true-external) is operationalized in references/design-it-twice.md as a 'Dependency categories' subsection that gates constraint #4 (Ports & adapters) and is required output in the per-sub-agent prompt template's 'Dependency strategy' section. The deletion test and adapter-count rule in the shared architecture glossary that Rule 0's depth check applies are also adapted from this source."
