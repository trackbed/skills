  - id: modem-how-coding-agents-read-your-code
    url: https://modem.ai/blog/how-coding-agents-read-your-code
    title: "Modem Blog - How AI coding agents read your code"
    rationale: "The Traversable search-uniqueness check, the source-to-test file-name check, and the treatment of wildcard re-exports as weak entry points follow this article's measurements of how search-driven agents spend retrieval effort on names defined in many places and on barrel files that hide where a name is defined."
    usage: inspiration
