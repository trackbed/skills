  - id: compound-engineering-ce-compound-refresh
    url: https://github.com/EveryInc/compound-engineering-plugin/tree/main/skills/ce-compound/references/refresh
    title: "EveryInc compound-engineering-plugin - ce-compound refresh workflow"
    rationale: "The `--refresh` mode's stale-learning refresh workflow, keep/update/consolidate/delete classifications, evidence-first audit, and inbound-reference check before a delete are adapted from the refresh workflow, which now lives inside ce-compound. The confirmation gate before deleting or consolidating notes is a local choice."
