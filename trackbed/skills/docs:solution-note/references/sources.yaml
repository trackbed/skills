  - id: compound-engineering-ce-compound
    url: https://github.com/EveryInc/compound-engineering-plugin/tree/main/skills/ce-compound
    title: "EveryInc compound-engineering-plugin - ce-compound"
    rationale: "The solved-problem knowledge capture flow, solution-note shape, failed-approaches emphasis, and reuse guidance are adapted from ce-compound, as are holding a lesson in its cheapest durable form (a check before a note) and reusing the store's own frontmatter vocabulary. Routing domain terms to trackbed:docs:ubiquitous-language instead of writing the glossary here is a local choice."
    usage: inspiration
