    title: "Matt Pocock skills - codebase-design (SKILL.md)"
    rationale: "The architectural glossary (Module/Interface/Implementation/Depth/Seam/Adapter/Leverage/Locality) in the shared architecture glossary, including depth measured at the interface rather than by implementation size, is adapted from this source."
