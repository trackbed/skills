    title: "Matt Pocock skills - improve-codebase-architecture (SKILL.md)"
    rationale: "The commit-history hot-spot seeding for full-codebase scans, the post-report offer to record rejected candidates as ADRs, the three deepening-candidate patterns in references/checklist.md and the shared architecture glossary, and the checklist's hard-to-test-through-its-interface pattern are adapted from this source's Explore phase and grilling loop."
