    title: "Matt Pocock skills - codebase-design (DEEPENING.md)"
    rationale: "The deletion-test heuristic, adapter-count seam rule (one adapter = hypothetical seam, two = real seam), internal-seam principle, and replace-don't-layer test-migration rule in the shared architecture glossary (shared/architecture/references/architecture-language.md) are adapted from this source."
