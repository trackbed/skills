  - id: aihero-codebases-ai-agents-love
    url: https://www.aihero.dev/how-to-make-codebases-ai-agents-love
    title: "AI Hero - How To Make Codebases AI Agents Love"
    rationale: "The deepening-candidate direction — replacing many shallow modules with fewer deep ones behind simple interfaces — follows this article's argument that agents navigate and verify a codebase through its module interfaces."
    usage: inspiration
    last_reviewed_at: 2026-11-06
    fetch_mode: curl-html
    baseline_hash: "sha256:5cef0c99088b7d110dcb3c211c10d00d6d8dd7bdd03add3d6b9a2249fad3f893"
  - id: aihero-improve-codebase-architecture-guide
    url: https://www.aihero.dev/skills-improve-codebase-architecture
    title: "AI Hero - The /improve-codebase-architecture Skill"
    rationale: "The --for planned-change mode follows this guide's advice to point the scan at the next change and ask what would make it easy. The Phase 4 step 10 hand-off follows its advice to take one candidate per session, record the decision in a spec, and turn the rest into tickets. The checklist's hard-to-test pattern follows its use of the scan to find missing seams before testing legacy code, the plain 'nothing worth changing' outcome follows its warning that the scan rarely calls code fine, and the closing --for suggestion after an undirected run follows its advice to aim the scan at a planned change."
    usage: inspiration
    last_reviewed_at: 2026-11-06
    fetch_mode: curl-html
    baseline_hash: "sha256:5f9c90be2bb2a9f78e72faf2d3a16a7c1c4e8ce791ae6ca68ceba6bb5536c4ae"
