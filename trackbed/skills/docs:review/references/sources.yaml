    title: "google/elephant-goldfish-model - inventive catalyst reviewer"
    rationale: "The opt-in false-compromise read, which asks whether a trade-off a design accepts as unavoidable could be removed, treats a clean result as normal, excludes physical, mathematical, and theoretical limits, and requires every suggested pattern to state its own cost, is informed by this source. Its pattern catalog is not copied; the read uses trackbed's own list. Reviewed at upstream commit 6a8001ea31ccf72430ba0603a467ec6df9f69dd7."
