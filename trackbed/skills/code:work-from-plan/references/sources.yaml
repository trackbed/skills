sources:
  - id: compound-ce-work
    url: https://github.com/EveryInc/compound-engineering-plugin/tree/main/skills/ce-work
    title: "EveryInc compound-engineering-plugin - ce-work"
    rationale: "The plan intake, route-before-work gate, context gathering before edits, missing-requirement handling, and bounded execution loop are adapted from ce-work while intentionally omitting broader autonomous pipeline behavior. Returning a blocker instead of prompting under delegation, proceeding on defaulted open questions as recorded assumptions, per-criterion closeout evidence, and keeping plan-local IDs out of written files also follow ce-work and its reference files."
    usage: inspiration
    last_reviewed_at: 2026-11-06
    baseline_commit: "7dc50943bbf959dbe6a93a175e41e5fff8395e00"
    fetch_mode: github-directory
    baseline_hash: "sha256:8234de56af86b12b280f31623ec559002ffcd8a55cd5d061c13a189d9172a906"
  - id: compound-ce-plan
    url: https://github.com/EveryInc/compound-engineering-plugin/tree/main/skills/ce-plan
    title: "EveryInc compound-engineering-plugin - ce-plan"
    rationale: "The standalone plan-shape assumptions, completion-criteria emphasis, dependency awareness, and missing-context markers consumed by this adapter are adapted from ce-plan. Its reference files also inform reading planned new files as expected-absent, open questions as carrying defaults, and plan-declared STOP conditions."
    usage: inspiration
    last_reviewed_at: 2026-11-06
    baseline_commit: "7dc50943bbf959dbe6a93a175e41e5fff8395e00"
    fetch_mode: github-directory
    baseline_hash: "sha256:5b23f2f6d9ed64d7b7226d9c3c40112d27846cf734d6b4d6dce55fc8deb14067"
  - id: addy-context-engineering
    url: https://raw.githubusercontent.com/addyosmani/agent-skills/main/skills/context-engineering/SKILL.md
    title: "Addy Osmani agent-skills - context engineering"
    rationale: "The shared implementation checklist and selective context loading retain ideas from this source in original local language. The shared forward-progress reference's context-recovery paragraph retains its idea of reloading governing requirements and rebuilding task state when assumptions drift. Its context-reset rules, which rebuild from the branch, working tree, and commits rather than memory and ask again for approvals that no durable record shows, follow the restartable task boundaries added in upstream commit a1c9bd627c38ac46630c4cdf0399c6985fb83f27. The review date and hash preserve the original review against upstream commit 5e262b20e0cd88dba39e558f42f5c0b6d766d4b4."
    usage: inspiration
    last_reviewed_at: 2026-11-06
    baseline_commit: "301b02b12bff98e4688e6984af6556802322bbde"
    baseline_hash: "sha256:ff9d4e5706bdd2eb7de1bfed569f1f42d28e478979ce6fcc32e617e7861b491d"
  - id: modem-how-coding-agents-read-your-code
    url: https://modem.ai/blog/how-coding-agents-read-your-code
    title: "Modem Blog - How AI coding agents read your code"
    rationale: "The shared implementation checklist's name-collision search before adding an exported name or file follows this article's finding that search-driven agents spend more retrieval effort on names defined in many places."
    usage: inspiration
    last_reviewed_at: 2026-10-28
    fetch_mode: curl-html
    baseline_hash: "sha256:b864a980008561eaebd7e285af9bd19c1eacd078de99268ff88843a527179521"
  - id: vuk97-forward-implementation-first
    url: https://raw.githubusercontent.com/Vuk97/forward-implementation-first/main/SKILL.md
    title: "Forward implementation first"
    rationale: "The distinction between implementation, correctness evidence, and advisory bookkeeping, together with smallest-dependency-cone replay, inspired this repository-specific forward-progress convention."
    usage: inspiration
    last_reviewed_at: 2026-11-06
    baseline_commit: 2d4dd7eacb4c41a31d85501f6f44d33fef21017a
