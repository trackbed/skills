<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" font-family="'Avenir Next', 'Segoe UI', Helvetica, Arial, sans-serif">
  <!--
    Starter for a sketch drawn for one interview question. Copy it, keep the sizes and colours, replace the content.
    - Always 480 by 300, so the sketches of two options line up and compare at a glance.
    - Draw only what differs between the options, plus enough around it to place it. Six to eight shapes is plenty.
    - Grey is what exists today. Green is what this option adds or changes. Leave green out when nothing is new.
    - Text stays at 14 or above, and says what a real screen or box would say, never "lorem ipsum".
    - The sketch is shown as a picture: no script, no links, no fonts or images loaded from elsewhere.
  -->
  <title>What the sketch shows, in one sentence</title>
  <rect width="480" height="300" fill="#ffffff"/>

  <!-- the frame: a screen, a service, or a document -->
  <rect x="20" y="20" width="440" height="260" rx="10" fill="#f5f4ef" stroke="#565c64" stroke-width="1.5"/>
  <text x="44" y="58" font-size="18" font-weight="600" fill="#1a1d21">Sign in</text>

  <!-- what exists today -->
  <rect x="44" y="76" width="392" height="36" rx="6" fill="#ffffff" stroke="#aab1bb"/>
  <text x="56" y="100" font-size="15" fill="#565c64">ada@example.com</text>

  <!-- what this option adds -->
  <rect x="44" y="124" width="392" height="58" rx="6" fill="#dcefe3" stroke="#17663a" stroke-width="2"/>
  <text x="56" y="148" font-size="15" fill="#1a1d21">Code from your email</text>
  <text x="56" y="170" font-size="15" fill="#565c64">_ _ _ _ _ _</text>

  <!-- an action -->
  <rect x="44" y="198" width="120" height="30" rx="6" fill="#0b6259"/>
  <text x="104" y="218" font-size="14" fill="#ffffff" text-anchor="middle">Sign in</text>
</svg>
