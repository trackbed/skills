sources:
  - id: compound-ce-strategy
    url: https://github.com/EveryInc/compound-engineering-plugin/tree/main/skills/ce-strategy
    title: "EveryInc compound-engineering-plugin - ce-strategy"
    rationale: "The optional STRATEGY.md grounding and propagation of product strategy context into planning artifacts are adapted from this source: its downstream handoff to planning skills, the sections and last_updated frontmatter in references/strategy-template.md that the stale-context marker reads, and the last_updated maintenance in references/update-run.md."
    usage: inspiration
    last_reviewed_at: 2026-11-06
    baseline_commit: "7dc50943bbf959dbe6a93a175e41e5fff8395e00"
    baseline_hash: ""
  - id: compound-ce-strategy-references
    url: https://github.com/EveryInc/compound-engineering-plugin/tree/main/skills/ce-strategy/references
    title: "EveryInc compound-engineering-plugin - ce-strategy references"
    rationale: "The shared strategy reader this skill follows, which accepts compound's current and legacy strategy headings as aliases, reads hand-written files by meaning, and treats a root PRODUCT.md or VISION.md as fallback context, is informed by these reference files."
    usage: inspiration
    last_reviewed_at: 2026-11-09
    baseline_commit: "7dc50943bbf959dbe6a93a175e41e5fff8395e00"
    fetch_mode: github-directory
    baseline_hash: "sha256:f91e63ca227728f053bf084f66a4b2b18f6b5c21fc67435396080591c6c0ae4b"
  - id: compound-ce-plan
    url: https://github.com/EveryInc/compound-engineering-plugin/tree/main/skills/ce-plan
    title: "EveryInc compound-engineering-plugin - ce-plan"
    rationale: "The strategy-aware planning handoff and non-blocking treatment of strategy conflicts are informed by references/research.md, which carries STRATEGY.md into the planning context and flags plan decisions that pull away from its active tracks or land inside its boundaries, without stopping the plan."
    usage: inspiration
    last_reviewed_at: 2026-11-06
    baseline_commit: "7dc50943bbf959dbe6a93a175e41e5fff8395e00"
    baseline_hash: ""
  - id: compound-ce-brainstorm
    url: https://github.com/EveryInc/compound-engineering-plugin/tree/main/skills/ce-brainstorm
    title: "EveryInc compound-engineering-plugin - ce-brainstorm"
    rationale: "The use of product strategy as grounding for requirement capture before planning is informed by references/dialogue.md, whose constraint check reads STRATEGY.md for product direction and boundaries, and by the requirements-only plan described in references/brainstorm-sections.md. Routing a requirements-only spec to a discovery interview instead of planning deliberately departs from this source, whose Ready for Planning Check clears a requirements-only plan for ce-plan to enrich."
    usage: inspiration
    last_reviewed_at: 2026-11-06
    baseline_commit: "7dc50943bbf959dbe6a93a175e41e5fff8395e00"
    baseline_hash: ""
  - id: compound-ce-ideate
    url: https://github.com/EveryInc/compound-engineering-plugin/tree/main/skills/ce-ideate
    title: "EveryInc compound-engineering-plugin - ce-ideate"
    rationale: "Treating ideation output as product direction that still needs requirement capture before planning is informed by references/post-ideation-workflow.md, which hands one chosen idea and its evidence to brainstorming rather than straight to ce-plan."
    usage: inspiration
    last_reviewed_at: 2026-11-06
    baseline_commit: "7dc50943bbf959dbe6a93a175e41e5fff8395e00"
    baseline_hash: ""
