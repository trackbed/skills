    rationale: "A read-only helper that reads installed skill descriptions at run time, infers the workflow stage from artifact names without reading their contents, treats matched files as hints rather than proof, replies with at most three commands in the host's command form, and leaves another skill's pending prompt alone is informed by this draft design from pull request #218; reviewed at upstream commit 394aa38db6ceb641d4e37adc552e0a56535aa093."
