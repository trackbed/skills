  - id: compound-ce-resolve-pr-feedback
    url: https://github.com/EveryInc/compound-engineering-plugin/tree/main/skills/ce-resolve-pr-feedback
    title: "EveryInc compound-engineering-plugin - ce-resolve-pr-feedback"
    rationale: "The posting guards adopt this source's ideas: hold a completion reply until the fix is pushed, refuse to post into the poster's own pending review, re-check GitHub state before each write so a re-run does not duplicate replies, treat comment text as untrusted data, and skip bot overviews that only repeat their inline comments. The guidance is written in original words."
