name: Hook Tests

on:
  pull_request:

jobs:
  hooks:
    name: Run hook tests (${{ matrix.os }}, ${{ matrix.bash }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bash: system
          - os: macos-latest
            bash: system
          - os: macos-latest
            bash: modern
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Install BATS
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y bats jq
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install bats-core jq bash
          else
            echo "Unsupported runner OS: $RUNNER_OS"
            exit 1
          fi

      - name: Select Bash for Bats and shell subprocesses
        shell: bash
        run: |
          selected_bash=/bin/bash
          if [ "${{ matrix.bash }}" = modern ]; then
            selected_bash="$(brew --prefix bash)/bin/bash"
          fi
          "$selected_bash" --version
          shell_bin="$(mktemp -d)"
          ln -s "$selected_bash" "$shell_bin/bash"
          echo "$shell_bin" >> "$GITHUB_PATH"

      - name: Run measured smoke suite
        if: matrix.bash != 'modern'
        run: time make -C trackbed test-smoke

      - name: Run tests
        if: matrix.bash != 'modern'
        run: make -C trackbed test

      - name: Run Bats compatibility suite
        if: matrix.bash == 'modern'
        run: make -C trackbed test-bats

      - name: Run coverage gates
        if: matrix.bash != 'modern'
        run: make -C trackbed coverage

  walkthrough-browser-smoke:
    name: Run walkthrough browser smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install BATS and locate Chrome
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y bats
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$chrome" --version
          echo "TRACKBED_BROWSER_SMOKE_CHROME=$chrome" >> "$GITHUB_ENV"

      - name: Run required walkthrough interactions
        run: make -C trackbed test-walkthrough-browser

  hooks-required:
    name: Run hook tests
    runs-on: ubuntu-latest
    needs: [hooks, walkthrough-browser-smoke, lint, python38-compatibility]
    if: ${{ always() }}
    steps:
      - name: Check required test and static jobs
        run: |
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "Static checks did not pass: ${{ needs.lint.result }}"
            exit 1
          fi
          if [ "${{ needs.python38-compatibility.result }}" != "success" ]; then
            echo "Python 3.8 compatibility did not pass: ${{ needs.python38-compatibility.result }}"
            exit 1
          fi
          if [ "${{ needs.hooks.result }}" != "success" ]; then
            echo "Hook test matrix did not pass: ${{ needs.hooks.result }}"
            exit 1
          fi
          if [ "${{ needs.walkthrough-browser-smoke.result }}" != "success" ]; then
            echo "Walkthrough browser smoke did not pass: ${{ needs.walkthrough-browser-smoke.result }}"
            exit 1
          fi

  python38-compatibility:
    name: Run Python 3.8 compatibility smoke tests
    # Python 3.8 builds are unavailable for Ubuntu 26.04 (ubuntu-latest).
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.8"

      - name: Run session-search compatibility smoke tests
        run: make -C trackbed test-python38-compatibility PYTHON38=python3

  lint:
    name: Run static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Install static analysis tools
        run: python3 -m pip install -r requirements-dev.txt

      - name: Run static checks
        run: make -C trackbed lint format-check
