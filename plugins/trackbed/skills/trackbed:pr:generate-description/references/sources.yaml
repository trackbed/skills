  - id: addy-git-workflow-versioning
    url: https://raw.githubusercontent.com/addyosmani/agent-skills/main/skills/git-workflow-and-versioning/SKILL.md
    title: "Addy Osmani agent-skills - git workflow and versioning"
    rationale: "Output markers, pull-request handoff conventions, and stating deliberate scope boundaries as reviewer notes are adapted from this source. The PR handoff discipline, structured change-summary expectations, and output-marker style that shape check mode's drift report come from the same source; they were reviewed against upstream commit 5e262b20e0cd88dba39e558f42f5c0b6d766d4b4 when check mode was a separate verifier skill. The release-impact contract for breaking changes, including saying whether old behavior keeps working through a deprecation period and until when, draws on its Release & Versioning section, added at upstream commit 1ffce563cf8a77c474f09b194ca93004a6f4a2b8."
