  - id: compound-code-review-deleted-files
    url: https://github.com/EveryInc/compound-engineering-plugin/blob/a00d47c57fede04ab9ff04d405fa3846b9561c90/skills/ce-code-review/references/diff-scope.md
    title: "EveryInc compound-engineering-plugin - ce-code-review diff scope (PR #1888)"
    rationale: "Showing whole-file deletions to the finder as headers only and reading a deleted body from the base only when a finding needs it is informed by this source."
    usage: inspiration
    last_reviewed_at: 2026-11-09
    baseline_commit: "a00d47c57fede04ab9ff04d405fa3846b9561c90"
    baseline_hash: ""
  - id: anthropic-claude-code-subagents
    url: https://code.claude.com/docs/en/sub-agents.md
    title: "Claude Code Docs - Create custom subagents"
    rationale: "The shared review model policy's rule that a stepped-down subagent does not inherit the session's effort level, so the launch passes it when known and otherwise reports the difference, follows this page's documented subagent effort field and parameter."
    usage: inspiration
    last_reviewed_at: 2026-11-19
    fetch_mode: curl-markdown
