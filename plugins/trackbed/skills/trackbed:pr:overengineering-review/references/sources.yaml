sources:
  - id: conductor-review-and-merge
    url: https://www.conductor.build/docs/guides/review-and-merge
    title: "Conductor Docs - Review and merge a workspace"
    rationale: "Conductor's local diff-comment and Checks workflow informs the optional projection of canonical review findings into workspace comments, and its merge-readiness check informs marking judgment-call comments as optional."
    usage: inspiration
    last_reviewed_at: 2026-11-09
    fetch_mode: curl-html
