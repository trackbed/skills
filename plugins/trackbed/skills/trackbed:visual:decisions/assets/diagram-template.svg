<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="'Avenir Next', 'Segoe UI', Helvetica, Arial, sans-serif">
  <!--
    Starter for a diagram drawn for a decision document. Copy it, keep the sizes and colours, replace the content.
    - 960 wide; make it taller before you make anything smaller. Text inside a shape stays at 18 or above;
      an arrow's label and the legend may be 16.
    - A box is a step or a part. A diamond is a question. An arrow is one thing leading to another; label it
      whenever it is not simply "then".
    - Colour says one thing: red is where it goes wrong, green is the path an option proposes, grey is
      everything else. Reword the legend to say which, and leave out a colour you did not use.
    - Show only what the source states. Six to eight shapes is plenty; split a bigger picture in two.
    - The file is shown as a picture: no script, no links, no fonts or images loaded from elsewhere.
  -->
  <title>What the diagram shows, in one sentence</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#565c64"/>
    </marker>
  </defs>
  <rect width="960" height="420" fill="#ffffff"/>

  <!-- a step -->
  <rect x="40" y="60" width="200" height="72" rx="8" fill="#f5f4ef" stroke="#565c64" stroke-width="1.5"/>
  <text x="140" y="103" font-size="18" fill="#1a1d21" text-anchor="middle">A request arrives</text>

  <line x1="240" y1="96" x2="318" y2="96" stroke="#565c64" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- a question -->
  <path d="M430 30 L540 96 L430 162 L320 96 z" fill="#f5f4ef" stroke="#565c64" stroke-width="1.5"/>
  <text x="430" y="92" font-size="18" fill="#1a1d21" text-anchor="middle">Is the</text>
  <text x="430" y="114" font-size="18" fill="#1a1d21" text-anchor="middle">slot free?</text>

  <!-- the path that goes wrong -->
  <line x1="540" y1="96" x2="678" y2="96" stroke="#565c64" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="609" y="84" font-size="16" fill="#565c64" text-anchor="middle">yes</text>
  <rect x="680" y="60" width="240" height="72" rx="8" fill="#fbe3df" stroke="#a8261d" stroke-width="2"/>
  <text x="800" y="92" font-size="18" fill="#1a1d21" text-anchor="middle">Both requests are</text>
  <text x="800" y="114" font-size="18" fill="#1a1d21" text-anchor="middle">saved</text>

  <!-- the proposed path -->
  <line x1="430" y1="162" x2="430" y2="246" stroke="#565c64" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="446" y="210" font-size="16" fill="#565c64">no</text>
  <rect x="310" y="248" width="240" height="72" rx="8" fill="#dcefe3" stroke="#17663a" stroke-width="2"/>
  <text x="430" y="280" font-size="18" fill="#1a1d21" text-anchor="middle">Offer the nearest</text>
  <text x="430" y="302" font-size="18" fill="#1a1d21" text-anchor="middle">free time</text>

  <!-- what the colours mean -->
  <rect x="40" y="372" width="18" height="18" rx="4" fill="#fbe3df" stroke="#a8261d" stroke-width="2"/>
  <text x="68" y="387" font-size="16" fill="#565c64">Where it goes wrong</text>
  <rect x="260" y="372" width="18" height="18" rx="4" fill="#dcefe3" stroke="#17663a" stroke-width="2"/>
  <text x="288" y="387" font-size="16" fill="#565c64">The proposed path</text>
</svg>
