<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="'Avenir Next', 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Two booking requests two seconds apart both find the slot free, so both are saved</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#565c64"/>
    </marker>
  </defs>
  <rect width="960" height="400" fill="#ffffff"/>

  <text x="40" y="44" font-size="16" fill="#565c64">First member, 09:41:07</text>
  <rect x="40" y="58" width="190" height="64" rx="8" fill="#f5f4ef" stroke="#565c64" stroke-width="1.5"/>
  <text x="135" y="97" font-size="18" fill="#1a1d21" text-anchor="middle">Presses Book</text>
  <line x1="230" y1="90" x2="298" y2="90" stroke="#565c64" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="300" y="58" width="230" height="64" rx="8" fill="#f5f4ef" stroke="#565c64" stroke-width="1.5"/>
  <text x="415" y="97" font-size="18" fill="#1a1d21" text-anchor="middle">Slot is read as free</text>
  <line x1="530" y1="90" x2="668" y2="158" stroke="#565c64" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="40" y="216" font-size="16" fill="#565c64">Second member, 09:41:09</text>
  <rect x="40" y="230" width="190" height="64" rx="8" fill="#f5f4ef" stroke="#565c64" stroke-width="1.5"/>
  <text x="135" y="269" font-size="18" fill="#1a1d21" text-anchor="middle">Presses Book</text>
  <line x1="230" y1="262" x2="298" y2="262" stroke="#565c64" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="300" y="230" width="230" height="64" rx="8" fill="#f5f4ef" stroke="#565c64" stroke-width="1.5"/>
  <text x="415" y="269" font-size="18" fill="#1a1d21" text-anchor="middle">Slot is read as free</text>
  <line x1="530" y1="262" x2="668" y2="196" stroke="#565c64" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="670" y="136" width="250" height="84" rx="8" fill="#fbe3df" stroke="#a8261d" stroke-width="2"/>
  <text x="795" y="172" font-size="18" fill="#1a1d21" text-anchor="middle">Two bookings saved</text>
  <text x="795" y="196" font-size="18" fill="#1a1d21" text-anchor="middle">for one studio</text>

  <rect x="40" y="352" width="18" height="18" rx="4" fill="#fbe3df" stroke="#a8261d" stroke-width="2"/>
  <text x="68" y="367" font-size="16" fill="#565c64">Where it goes wrong: nothing holds the slot between the read and the save</text>
</svg>
