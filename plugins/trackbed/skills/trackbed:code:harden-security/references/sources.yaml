    rationale: "The Three-Tier Boundary System, ASK FIRST gating, marker vocabulary, supply-chain install boundary, privacy-lifecycle engineering concepts, filename-only staged-secret check, Never Do rule against loosening security headers, and rotate-before-cleaning-history leak response are adapted from this source."
