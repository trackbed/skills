  - id: fetch-cors-protocol
    url: https://fetch.spec.whatwg.org/
    title: "WHATWG Fetch Standard"
    rationale: "The wildcard-CORS boundary distinguishes cross-origin response sharing from request execution and credential behavior, and excludes network-protected resources from the anonymous public-read exception. Credential-protected endpoints retain the skill's stricter prohibition."
    usage: inspiration
    last_reviewed_at: 2026-11-08
    fetch_mode: curl-html
    baseline_hash: "sha256:9dbf44b916686ef3f1a4d888dd55af1c66f97ad462b16a6c78fc151fb01f589f"
  - id: owasp-csrf-prevention
    url: https://raw.githubusercontent.com/OWASP/CheatSheetSeries/master/cheatsheets/Cross-Site_Request_Forgery_Prevention_Cheat_Sheet.md
    title: "OWASP Cross-Site Request Forgery Prevention Cheat Sheet"
    rationale: "The CSRF section and checklist group adapt its primary-control options, SameSite limitations, safe-method rule, fail-closed source- and target-origin checks, and same-origin client token scoping; the wildcard-CORS boundary names independent protections for cookie-authenticated state-changing requests."
