sources:
  - id: compound-ce-plan
    url: https://github.com/EveryInc/compound-engineering-plugin/tree/main/skills/ce-plan
    title: "EveryInc compound-engineering-plugin - ce-plan"
    rationale: "Stable issue identifier rules, repo-relative path discipline, and the risk-triggered confidence deepening gate are adapted from ce-plan's reference files: the never-renumbered U-IDs in references/plan-sections.md, the repo-relative file paths in references/structure.md, the risk-profile deepening gate in references/final-review.md, and the confidence-gap scoring in references/deepening-workflow.md. Stopping on a requirements-only spec and routing it to a discovery interview deliberately departs from ce-plan, which enriches a requirements-only plan directly."
    usage: inspiration
    last_reviewed_at: 2026-11-06
    baseline_commit: "7dc50943bbf959dbe6a93a175e41e5fff8395e00"
    baseline_hash: ""
  - id: compound-ce-plan-structure
    url: https://github.com/EveryInc/compound-engineering-plugin/blob/main/skills/ce-plan/references/structure.md
    title: "EveryInc compound-engineering-plugin - ce-plan structure reference"
    rationale: "The deepening gate's finding threshold for unrequested mechanisms (contract, costly unnoticed failure, expensive to add later) and its one-line record of declined findings adapt the reference's judge-each-concern rule; the issue template's test-limits line adapts its one-line note on what a test seam catches and misses. No upstream prose is copied."
    usage: inspiration
    upstream_path: "skills/ce-plan/references/structure.md"
    last_reviewed_at: 2026-11-09
    baseline_commit: "315bfde626f821e118bd612c86a27e92f9980edb"
    baseline_hash: "sha256:b3c7b1ee80e7816bc2456268177878cc8c2a9427aa3dd9d106558c7ec9113142"
  - id: pocock-to-tickets
    url: https://raw.githubusercontent.com/mattpocock/skills/main/skills/engineering/to-tickets/SKILL.md
    title: "Matt Pocock skills - to-tickets"
    rationale: "The tracer-bullet vertical-slice rule, wide-refactor expand-contract exception, explicit blocking edges, the breakdown review's check for unneeded blocking edges, and frontier-based issue sequencing are adapted from this source; the local HITL/AUTO mode tag preserves earlier Pocock HITL/AFK lineage."
    usage: inspiration
    last_reviewed_at: 2026-11-06
    baseline_commit: "4ae2317ddb22b046e26455e4f9c9b3aaaf62212d"
    baseline_hash: "sha256:918bdefab9313100cb1f7ccb412e2a773fe2f2801dd20d44f6b2acf7a42ca456"
  - id: aihero-codebases-ai-agents-love
    url: https://www.aihero.dev/how-to-make-codebases-ai-agents-love
    title: "AI Hero - How To Make Codebases AI Agents Love"
    rationale: "The issue template's Interface Impact section and the interface-aware task rule, which makes an unsettled interface a HITL blocker for the AUTO tasks behind it, follow this article's division of labor in which people own module interfaces and agents own implementations."
    usage: inspiration
